# Google Speech Commands V2, 12-class task.
data:
  root: data/speech_commands
  unknown_fraction: 0.1
  silence_fraction: 0.1
  seed: 7
  cache_dir: data/cache

frontend:
  window_ms: 40.0    # 640 samples at 16 kHz
  hop_ms: 20.0       # 49 frames per second of audio
  n_mels: 40
  n_mfcc: 10         # 10 x 49 = 490 values per inference
  fmin: 20.0
  fmax: 7600.0

model:
  channels: 64
  n_blocks: 4
  dropout: 0.2

train:
  epochs: 18
  batch_size: 128
  lr: 0.003
  weight_decay: 0.0001
  patience: 5
  seed: 7
  augment: true
